<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="calculator">
        <div class="output">0</div>

        <!-- Buttons -->
        <div class="buttons">
            <!-- OPERATORS & SPECIAL CHARACTERS -->
            <button class="btn key">&lAarr;</button>
            <button class="btn key">AC</button>
            <button class="btn key">&percnt;</button>
            <button class="btn operator">&divide;</button>

            <button class="btn">7</button>
            <button class="btn">8</button>
            <button class="btn">9</button>
            <button class="btn operator">&times;</button>

            <button class="btn">4</button>
            <button class="btn">5</button>
            <button class="btn">6</button>
            <button class="btn operator">-</button>

            <button class="btn">1</button>
            <button class="btn">2</button>
            <button class="btn">3</button>
            <button class="btn operator">+</button>

            <!-- KEYS -->
            <button class="btn">&PlusMinus;</button>
            <button class="btn">0</button>
            <button class="btn">&period;</button>
            <button class="btn operator">&equals;</button>
        </div>
    </div>

    </div>

</body>

</html>
