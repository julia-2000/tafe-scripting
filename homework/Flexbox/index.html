<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>
    <style>
        /* Parent Flex Container */
        .container {
            /* Flex is apply to the parent element and become a flex container */
            /* display: flex;
            flex-direction: row; */
        }

        /* Children Flex items  */
        .box {
            width: 150px;
            height: 150px;
            border-radius: 15px;
            text-align: center;
            font-size: 8rem;
        }

        /* Items */
        #box1 {
            background-color: rgb(255, 77, 0);
        }

        #box2 {
            background-color: rgb(255, 242, 0);
        }

        #box3 {
            background-color: rgb(153, 255, 0);
        }

        #box4 {
            background-color: rgb(0, 102, 255);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box" id="box1">1</div>
        <div class="box" id="box2">2</div>
        <div class="box" id="box3">3</div>
        <div class="box" id="box4">4</div>
        <!-- <div class="box" id="box1">1</div>
        <div class="box" id="box2">2</div>
        <div class="box" id="box3">3</div>
        <div class="box" id="box4">4</div> -->
    </div>

</body>

</html>
