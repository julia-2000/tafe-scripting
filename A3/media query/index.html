<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query</title>
    <style>
        @media (max-width:600px) {
            nav a {
                display: block;
                background-color: violet;
            }
        }

        @media (max-width:800px) {
            nav a {
                display: block;
                background-color: bisque;
            }
        }
    </style>
</head>
