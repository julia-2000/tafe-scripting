<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess Game</title>
</head>

<body>
    <h2>Guess the Number</h2>
    <p>Guess the Number between 1 and 10.</p>
    <input type="number" id="guessInput">
    <button onclick="checkGuess()">Check Guess</button>
    <div id="gameResult">

    </div>

    <script>
        // Create variable guess
        let guessInput = document.getElementById("guessInput");
        let gameResult = document.getElementById("gameResult");
        let secretNumber = Math.floor(Math.random() * 10) + 1;
        let attempts = 3;
        let gameOver = false;


        function checkGuess() {
            let guess = Number(guessInput.value);

            if (guess === secretNumber) {
                gameOver = true;
                gameResult.textContent = "Congratulations!";
            }
            else {
                attempts--;

                if (attempts === 0) {
                    gameResult.textContent = "Out of attempts, the Secret Number is: " + secretNumber;
                }
                else {
                    if (guess > secretNumber) {
                        gameResult.textContent = "The Number too hight. Try Again!"
                    }
                    else {
                        gameResult.textContent = "The Number too low. Try Again!"
                    }
                }
            }

            console.log("Secret Number " + secretNumber);

        }


    </script>
</body>

</html>
